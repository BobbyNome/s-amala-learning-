<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sʰamala Chumash Dictionary & Study Portal</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #9a3412;
      --primary-hover: #7c2d12;
      --accent: #d97706;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 1.5rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 1.75rem; }
    header h1 { color: var(--primary); font-size: 2.2rem; margin-bottom: 0.3rem; }
    header p { color: var(--text-muted); font-size: 1rem; }
    
    .nav {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .nav button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .nav button.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Alpha Filter Bar */
    .alpha-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .alpha-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
    }
    .alpha-btn:hover, .alpha-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Dictionary View */
    .search-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .search-bar {
      flex: 1;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    .search-bar:focus { border-color: var(--primary); }
    .count-tag {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      text-align: right;
    }

    .word-list { display: grid; gap: 0.85rem; }
    .word-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1.3rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 0.4rem;
    }
    .samala-word { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
    .english-word { color: var(--text); font-size: 1.05rem; font-weight: 500; }
    .word-notes { font-size: 0.85rem; color: var(--text-muted); font-style: italic; }

    /* Flashcard View */
    .flashcard-wrapper {
      perspective: 1000px;
      margin: 1.5rem auto;
      max-width: 480px;
      height: 260px;
      cursor: pointer;
    }
    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .flashcard.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }
    .card-back { transform: rotateY(180deg); background: #fff7ed; }
    .card-face h2 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .card-face p { color: var(--text-muted); font-size: 0.9rem; }
    .card-controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.3rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .btn:hover { background: var(--primary-hover); }

    /* Quiz View */
    .quiz-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      box-shadow: var(--shadow);
      max-width: 520px;
      margin: 0 auto;
    }
    .quiz-options {
      display: grid;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .quiz-option {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: 0.2s;
    }
    .quiz-option:hover { border-color: var(--primary); }
    .quiz-feedback { margin-top: 1rem; font-weight: 600; min-height: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Sʰamala Chumash Portal</h1>
      <p>Applegate Dictionary Edition (July 2026 update)</p>
    </header>

    <div class="nav">
      <button class="active" onclick="switchTab('dict')">Dictionary</button>
      <button onclick="switchTab('flashcards')">Flashcards</button>
      <button onclick="switchTab('quiz')">Quick Quiz</button>
    </div>

    <!-- DICTIONARY VIEW -->
    <section id="tab-dict" class="tab-content active">
      <div class="alpha-bar" id="alphaBar"></div>
      <div class="search-box">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search in Sʰamala or English (diacritics optional)..." oninput="filterWords()" />
      </div>
      <div id="countTag" class="count-tag">Showing all words</div>
      <div id="wordList" class="word-list"></div>
    </section>

    <!-- FLASHCARDS VIEW -->
    <section id="tab-flashcards" class="tab-content">
      <div class="flashcard-wrapper" onclick="flipCard()">
        <div id="flashcard" class="flashcard">
          <div class="card-face card-front">
            <h2 id="fcSamala" class="samala-word">---</h2>
            <p>(Click or tap to flip)</p>
          </div>
          <div class="card-face card-back">
            <h2 id="fcEnglish" style="color: var(--primary);">---</h2>
            <p id="fcNotes" class="word-notes">---</p>
          </div>
        </div>
      </div>
      <div class="card-controls">
        <button class="btn" onclick="prevCard()">Previous</button>
        <span id="fcCounter" style="align-self: center; font-weight: 600;">1 / 1</span>
        <button class="btn" onclick="nextCard()">Next</button>
        <button class="btn" style="background:#64748b;" onclick="shuffleCards()">Shuffle</button>
      </div>
    </section>

    <!-- QUIZ VIEW -->
    <section id="tab-quiz" class="tab-content">
      <div class="quiz-box">
        <p style="color: var(--text-muted); font-size: 0.9rem;">What does this Sʰamala word or phrase mean?</p>
        <h2 id="quizWord" class="samala-word" style="margin: 0.75rem 0 1.25rem; font-size: 2rem;">---</h2>
        <div id="quizOptions" class="quiz-options"></div>
        <div id="quizFeedback" class="quiz-feedback"></div>
        <button id="nextQuizBtn" class="btn" style="margin-top: 1.2rem; display: none;" onclick="setupQuizQuestion()">Next Question</button>
      </div>
    </section>
  </div>

    const vocabulary = [
